<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="海报与正片 · 牛来梗小游戏">
<meta property="og:description" content="好看的是假的，难看的才是真的。收票根，凑满 ¥7705 票房。">
<meta name="description" content="电影《牛来》(2026) 粉丝二创小游戏：在海报与正片两个世界之间切换，收票根凑票房。">
<title>海报与正片 · 致敬《牛来》的非官方小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0c0a; }
  body { display: flex; align-items: center; justify-content: center;
         font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; }
  #wrap { position: relative; }
  canvas { display: block; background: #f3ead8; }

  /* ---------- HUD ---------- */
  #hud { position: absolute; inset: 0; pointer-events: none; display: none; }
  .chip {
    position: absolute; padding: 6px 14px; border-radius: 4px;
    font-size: 15px; letter-spacing: 1px; line-height: 1.5;
  }
  #boxoffice {
    top: 12px; left: 14px;
    background: rgba(28,26,23,.82); color: #f3ead8;
    border: 1px solid rgba(243,234,216,.25);
  }
  #boxoffice b { color: #ffd76a; font-weight: normal; }
  #modechip {
    top: 12px; right: 14px; text-align: right;
    transition: all .15s ease;
  }
  #modechip.poster {
    background: rgba(28,26,23,.85); color: #f3ead8;
    border: 1px solid #c8402a; box-shadow: 0 0 0 2px rgba(200,64,42,.2);
  }
  #modechip.film {
    background: rgba(190,190,190,.9); color: #333;
    border: 1px solid #666; font-family: "Songti SC", "SimSun", serif;
  }
  #modechip small { display: block; font-size: 11px; opacity: .75; }

  /* ---------- 遮罩层通用 ---------- */
  .overlay {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center; flex-direction: column;
    background: rgba(16,14,12,.55); backdrop-filter: blur(2px);
  }
  .panel {
    background: #f3ead8; color: #2a2620; text-align: center;
    padding: 34px 44px; border-radius: 6px; max-width: 640px;
    box-shadow: 0 12px 60px rgba(0,0,0,.5);
    border: 1px solid #d8ccb2; position: relative;
  }
  .panel::after { /* 红印章 */
    content: "牛"; position: absolute; right: 18px; top: 18px;
    width: 34px; height: 34px; line-height: 34px;
    background: #c8402a; color: #f3ead8; font-size: 20px;
    border-radius: 3px; opacity: .92;
  }
  h1 { font-size: 42px; letter-spacing: 10px; margin-bottom: 6px; font-weight: normal; }
  .sub { font-size: 14px; color: #8a7f6a; margin-bottom: 18px; }
  .rule {
    font-size: 19px; margin: 14px 0 18px; letter-spacing: 2px;
    border-top: 1px solid #d8ccb2; border-bottom: 1px solid #d8ccb2;
    padding: 12px 0; color: #6b3226;
  }
  .keys { font-size: 15px; line-height: 2; color: #4a4438; }
  .keys kbd {
    font-family: inherit; background: #2a2620; color: #f3ead8;
    padding: 1px 9px; border-radius: 3px; font-size: 13px; margin: 0 2px;
  }
  .startbtn, .endbtn {
    margin-top: 20px; font-family: inherit; font-size: 18px; letter-spacing: 4px;
    padding: 10px 38px; background: #2a2620; color: #f3ead8;
    border: none; border-radius: 4px; cursor: pointer;
  }
  .startbtn:hover, .endbtn:hover { background: #c8402a; }
  .startbtn.alt { background: #6b6254; font-size: 15px; letter-spacing: 2px; padding: 10px 20px; margin-left: 10px; }
  .endbtn.alt { background: #6b6254; font-size: 15px; letter-spacing: 2px; padding: 8px 18px; margin-left: 10px; }
  .credit { margin-top: 16px; font-size: 11px; color: #a89b82; }

  /* ---------- 散场结算 ---------- */
  #endo { display: none; }
  #endo .panel { max-width: 700px; padding: 28px 40px; }
  #screenTxt {
    background: #16140f; color: #7a7264; font-size: 22px; letter-spacing: 14px;
    padding: 12px 0 10px; margin: 4px auto 14px; width: 78%;
    border-radius: 3px 3px 40% 40% / 3px 3px 14px 14px;
  }
  #seats { line-height: 1.15; font-size: 17px; letter-spacing: 3px; margin-bottom: 14px; user-select: none; }
  #seats .row { white-space: nowrap; }
  #seats .s { color: #cabfa6; }
  #seats .p { color: #c8402a; }
  #endstats { font-size: 16px; line-height: 1.9; color: #4a4438; }
  #endstats b { color: #6b3226; }
  #totalbar {
    width: 82%; height: 14px; margin: 10px auto 4px; background: #e2d7bd;
    border-radius: 7px; overflow: hidden; border: 1px solid #cabfa6;
  }
  #totalfill { height: 100%; background: linear-gradient(90deg,#c8402a,#e8863a); width: 0%; transition: width 1s ease; }
  #totaltxt { font-size: 13px; color: #8a7f6a; margin-bottom: 10px; }
  #ach {
    display: none; margin: 10px auto 2px; font-size: 22px; letter-spacing: 6px;
    color: #f3ead8; background: #c8402a; padding: 8px 20px; width: fit-content;
    border-radius: 4px; transform: rotate(-2deg);
    box-shadow: 0 4px 18px rgba(200,64,42,.45);
  }
  .quote {
    font-size: 14px; color: #6b6254; margin-top: 4px; font-style: normal;
  }
  .quote::before { content: "★★★★★ "; color: #e8a63a; letter-spacing: 2px; font-size: 12px; }
  #resetTotal { background: none; border: none; color: #a89b82; font-size: 11px;
    margin-top: 12px; cursor: pointer; text-decoration: underline; font-family: inherit; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="chip" id="boxoffice">本场票房 <b>¥0.0</b>　·　累计 ¥0.0</div>
    <div class="chip poster" id="modechip">海报<small>X 切换世界</small></div>
  </div>

  <div class="overlay" id="menu">
    <div class="panel">
      <h1>海报与正片</h1>
      <div class="sub">电影《牛来》(2026) 粉丝二创小游戏 · 主演：牛来 本牛 · 在梦里，把今生预演一遍</div>
      <div class="rule">好看的是假的，难看的才是真的。</div>
      <div class="keys">
        <kbd>←</kbd><kbd>→</kbd> 移动　<kbd>空格</kbd> 跳跃　<kbd>X</kbd> 在海报与正片之间切换<br>
        海报世界身轻如纸，可以飘过深渊与尖刺，但画上去的东西踩不实；<br>
        正片世界一切粗糙但真实，票根也只有在正片里才收得进口袋。
      </div>
      <div>
        <button class="startbtn" id="startbtn">开 场</button>
        <button class="startbtn alt" id="endlessbtn">无尽 · 排片保卫战</button>
      </div>
      <div class="credit">目标：凑满 ¥7705 的累计票房 · 粉丝二创 · 非官方 · 非商用<br>无尽模式：黑幕全程追击，一命到底，排片越多票价越贵</div>
    </div>
  </div>

  <div class="overlay" id="endo">
    <div class="panel">
      <div id="screenTxt">散　场</div>
      <div id="seats"></div>
      <div id="ach">成就解锁：年度最炸裂</div>
      <div id="endstats"></div>
      <div id="totalbar"><div id="totalfill"></div></div>
      <div id="totaltxt"></div>
      <div class="quote" id="q1"></div>
      <div class="quote" id="q2"></div>
      <div class="credit">致敬《牛来》剧组全体两位成员<br>（片尾曲《雨后轻风有香》请自行脑补）</div>
      <button class="endbtn" id="againbtn">再 来 一 场</button><button class="endbtn alt" id="modeSwapBtn">无 尽 模 式</button><br>
      <button id="resetTotal">清空累计票房</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
